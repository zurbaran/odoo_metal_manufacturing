name: Odoo 18 tests

on:
  push:
    branches:
      - "18.0"
      - "18.0-*"
  pull_request:
    branches:
      - "18.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo18-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test custom modules
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout custom modules
        uses: actions/checkout@v7
        with:
          path: custom-addons

      - name: Checkout Odoo 18
        uses: actions/checkout@v7
        with:
          repository: odoo/odoo
          ref: "18.0"
          path: odoo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libffi-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            pkg-config \
            postgresql-client \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r odoo/requirements.txt
          python -m pip install cairosvg

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: odoo
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U odoo -d postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: |
          createdb -h localhost -p 5432 -U odoo odoo18_test

      - name: Run Odoo module tests
        run: |
          python odoo/odoo-bin \
            --database=odoo18_test \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=odoo/addons,custom-addons \
            --init=product_blueprint_manager,product_configurator_attribute_price \
            --test-tags=/product_blueprint_manager,/product_configurator_attribute_price \
            --stop-after-init \
            --log-level=test
