name: Odoo 19 N43 beneficiary tests

on:
  push:
    branches:
      - "19.0"
      - "19.0-*"
  pull_request:
    branches: ["19.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-n43:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U odoo -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout addon
        uses: actions/checkout@v7
        with:
          path: custom-addons
      - name: Checkout Odoo 19
        uses: actions/checkout@v7
        with:
          repository: odoo/odoo
          ref: "19.0"
          path: odoo
          fetch-depth: 1
      - name: Checkout OCA account reconciliation
        uses: actions/checkout@v7
        with:
          repository: OCA/account-reconcile
          ref: "19.0"
          path: oca-account-reconcile
          fetch-depth: 1
      - name: Checkout OCA bank statement import
        uses: actions/checkout@v7
        with:
          repository: OCA/bank-statement-import
          ref: "19.0"
          path: oca-bank-statement-import
          fetch-depth: 1
      - name: Checkout OCA Spanish localization
        uses: actions/checkout@v7
        with:
          repository: OCA/l10n-spain
          ref: "19.0"
          path: oca-l10n-spain
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libffi-dev libjpeg-dev libldap2-dev libpq-dev libsasl2-dev libssl-dev libxml2-dev libxslt1-dev pkg-config postgresql-client zlib1g-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r odoo/requirements.txt
          python -m pip install chardet
      - name: Test N43
        run: |
          set +e
          python odoo/odoo-bin \
            --database=odoo19_test_n43 \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --addons-path=odoo/addons,custom-addons,oca-account-reconcile,oca-bank-statement-import,oca-l10n-spain \
            --init=account_reconcile_n43_beneficiary \
            --test-tags=/account_reconcile_n43_beneficiary \
            --stop-after-init --log-level=test \
            > /tmp/odoo19-n43-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "ERROR|FAIL|Traceback|AssertionError|ParseError|TypeError|AttributeError" /tmp/odoo19-n43-tests.log | tail -n 160 || true
            tail -n 160 /tmp/odoo19-n43-tests.log
          fi
          exit "$status"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo19-n43-test-log
          path: /tmp/odoo19-n43-tests.log
          if-no-files-found: ignore
